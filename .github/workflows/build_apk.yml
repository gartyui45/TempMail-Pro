name: Build TempMail APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Permite execução manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🛠️ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: 📦 Instalar dependências
        run: flutter pub get

      - name: ✅ Analisar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🧪 Rodar testes
        run: flutter test || echo "Sem testes configurados"

      - name: 🏗️ Build APK Release
        run: flutter build apk --release --split-per-abi

      - name: 📤 Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: TempMail-App-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: 📤 Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: TempMail-App-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: 📤 Upload APK (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: TempMail-App-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: 📤 Upload APK Universal
        uses: actions/upload-artifact@v4
        with:
          name: TempMail-App-Universal
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 🚀 Criar Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "TempMail Pro v1.0.${{ github.run_number }}"
          body: |
            ## 🚀 TempMail Pro - E-mail Temporário Premium
            
            ### ✨ Recursos:
            - 📧 E-mail descartável com domínios obscuros
            - 🔄 Auto-refresh a cada 10 segundos
            - 🎨 Interface Neon 3D Premium
            - ⚡ Rápido e leve
            - 🔒 Privacidade total
            
            ### 📥 Downloads:
            - Baixe o APK correspondente à sua arquitetura
            - Universal funciona em todos os dispositivos
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
