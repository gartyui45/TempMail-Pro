name: Build TempMail APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Permite execução manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🛠️ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Instalar dependências
        run: flutter pub get

      - name: ✅ Analisar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🧪 Rodar testes
        run: flutter test || echo "Sem testes configurados"

      - name: 📦 Instalar Android SDK 36
        run: |
          yes | sdkmanager "platforms;android-36" 2>&1 | tail -3 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: 🏗️ Build APK Release
        run: flutter build apk --release
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TempMail-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 🚀 Criar Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "TempMail Pro v1.0.${{ github.run_number }}"
          body: |
            ## 🚀 TempMail Pro - E-mail Temporário Premium
            
            ### ✨ Recursos:
            - 📧 E-mail descartável com domínios obscuros
            - 🔄 Auto-refresh a cada 10 segundos
            - 🎨 Interface Neon 3D Premium
            - ⚡ Rápido e leve
            - 🔒 Privacidade total
            
            ### 📥 Download:
            - APK Universal (arm64-v8a + armeabi-v7a)
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
